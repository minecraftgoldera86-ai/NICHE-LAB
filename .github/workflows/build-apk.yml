name: Build NICHE LAB APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract, fix launcher icon and build
        run: |
          unzip -q NICHE_LAB_ANDROID_PROJECT.zip -d extracted
          unzip -oq NICHE_LAB_ICON_UPDATE.zip -d extracted/niche-lab-android

          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          manifest = Path("extracted/niche-lab-android/app/src/main/AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          application = root.find("application")

          if application is None:
              raise SystemExit("AndroidManifest.xml has no application element")

          application.set(android + "icon", "@mipmap/ic_launcher")
          application.set(android + "roundIcon", "@mipmap/ic_launcher_round")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          print("NICHE LAB launcher icon references configured.")

          PY

          cd extracted/niche-lab-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: niche-lab-debug-apk
          path: extracted/niche-lab-android/app/build/outputs/apk/debug/app-debug.apk
          
